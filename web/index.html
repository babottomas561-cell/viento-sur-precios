<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tablero Viento Sur</title>
<meta name="description" content="Precios para stock que no rota: qué proponemos para cada producto, por qué, y los datos para auditarlo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="app.css?v=3bd62d964b">
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="marca">
      <b>Viento Sur</b>
      <span>Precios para stock que no rota</span>
    </div>
    <nav class="tabs" id="tabs" aria-label="Secciones"></nav>
    <div class="foto" id="foto"></div>
  </div>
</header>

<div class="filtros" id="filtros" role="region" aria-label="Filtros"></div>

<main class="contenido" id="vista" tabindex="-1"><p class="cargando-pagina"><span class="girando" aria-hidden="true"></span> Cargando los datos más nuevos…</p></main>

<footer class="pie">
  <div class="pie-in" id="pie"></div>
</footer>

<dialog class="subir" id="subir" aria-labelledby="subir-tit"></dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
// Publicado, el tablero abre los datos más nuevos de la base (o los que pida el link: ?datos=AAAA-MM-DD).
// Abierto como archivo, en la computadora, o si la base no responde, usa datos.js: los datos con los que se armó la página.
(function () {
  var cargar = function (src, listo) { var s = document.createElement("script"); s.src = src; s.onload = listo; document.body.appendChild(s); };
  var arrancar = function () { cargar("app.js?v=b9fc149f83"); };
  var local = function (motivo) { window.BASE = { online: false, motivo: motivo }; cargar("datos.js?v=76076799d9", arrancar); };
  if (location.protocol === "file:") return local("");
  var enLaCompu = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);   // en la computadora puede no haber servidor: sin aviso
  var q = new URLSearchParams(location.search), pedida = q.get("datos") || q.get("foto") || "";   // ?foto= era el nombre anterior
  var json = function (r) { return r.ok ? r.json() : Promise.reject(r.status); };
  var abrir = function (f) { return fetch("/api/abrir" + (f ? "?fecha=" + encodeURIComponent(f) : ""), { cache: "no-store" }).then(json); };
  var aviso = "";
  // un link viejo puede pedir una fecha que ya no está en la base: se abren los datos más nuevos y se avisa
  var datos = abrir(pedida).catch(function (e) {
    if (!pedida) throw e;
    aviso = "El link pedía los datos al " + pedida.split("-").reverse().join("/") + ", que no están en la base: se muestran los más nuevos.";
    return abrir("");
  });
  Promise.all([fetch("/api/cargados", { cache: "no-store" }).then(json), datos])
    .then(function (r) { window.DATOS = r[1]; window.BASE = { online: true, fotos: r[0].fotos, motivo: aviso }; arrancar(); })
    .catch(function () { local(enLaCompu ? "" : "La base no respondió: se muestran los datos con los que se publicó la página."); });
})();
</script>
</body>
</html>
